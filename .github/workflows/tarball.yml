name: Tarballs

# Do the packages work as published artifacts? Packs every package, installs only the tarballs into a scratch
# app (no workspace links; `overrides` send every internal dependency to its tarball), then runs census's
# tests and the site build from that install (tools/tarball-check). Phase 0 of the per-package repo split
# (https://github.com/enumeratio/notatio/wiki/Speculative-Per-Package-Repos §5): when this is green, a split
# holds nothing unknown except process.
#
# ADVISORY, never a required check. A failing step ends the run red, and a failure opens or reopens ONE rolling
# tracking issue (labelled `nightly-fixup`, which the fixup routine sweeps); a green run closes it. The report
# (report.md, a log per step) is the artifact, and its summary is on the run.

# Nightly only: it takes ~20 min to build and install everything from tarballs, and a daily signal is enough.

on:
  schedule:
    - cron: "41 5 * * *" # 05:41 UTC, after nightly.yml and plausible.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: tarballs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tarballs:
    name: build and test from tarballs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - id: run
        continue-on-error: true
        run: node tools/tarball-check/run.ts --out "$RUNNER_TEMP/tarball-report"
      - name: summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/tarball-report/report.md" ]; then
            cat "$RUNNER_TEMP/tarball-report/report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "tools/tarball-check wrote no report" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tarball-report
          path: ${{ runner.temp }}/tarball-report
          if-no-files-found: ignore
          retention-days: 14
      - name: open/reopen the tracking issue
        if: steps.run.outcome == 'failure'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const TITLE = 'tarball check failing'
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            let report = ''
            try { report = fs.readFileSync(`${process.env.RUNNER_TEMP}/tarball-report/report.md`, 'utf8') } catch {}
            const body = [
              `The **tarball check** failed: the packages do not all work installed from their tarballs. Trigger: ${context.eventName}.`,
              ``,
              `Run: ${runUrl} (the \`tarball-report\` artifact holds a log per step). Reproduce with \`node tools/tarball-check/run.ts\`. Report:`,
              ``,
              report.slice(0, 40000) || '(no report was written)',
            ].join('\n')
            const LABELS = ['bug', 'nightly-fixup']
            try {
              await github.rest.issues.createLabel({ ...context.repo, name: 'nightly-fixup', color: 'fbca04',
                description: 'swept nightly by the fixup routine' })
            } catch (e) { /* exists */ }
            const found = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue in:title "${TITLE}"`,
            })
            const existing = found.data.items.find(i => i.title === TITLE)
            if (existing) {
              if (existing.state === 'closed') {
                await github.rest.issues.update({ ...context.repo, issue_number: existing.number, state: 'open' })
              }
              await github.rest.issues.addLabels({ ...context.repo, issue_number: existing.number, labels: LABELS })
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body })
            } else {
              await github.rest.issues.create({ ...context.repo, title: TITLE, body, labels: LABELS })
            }

      - name: close the issue on recovery
        if: steps.run.outcome == 'success'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const TITLE = 'tarball check failing'
            const found = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${TITLE}"`,
            })
            const existing = found.data.items.find(i => i.title === TITLE)
            if (existing) {
              const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body: `Green again: the tarball check passed. ${runUrl}` })
              await github.rest.issues.update({ ...context.repo, issue_number: existing.number, state: 'closed' })
            }

      # The artifact is the report; this is the red/green: the job ends red when the check failed.
      - if: steps.run.outcome == 'failure'
        run: |
          echo "::error::build and test from tarballs failed (advisory, not a required check): see the tarball-report artifact"
          exit 1
