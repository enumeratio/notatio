name: compute-engine release bump

# When compute-engine publishes a release, opens `chore/ce-<version>` with the mechanical bump
# (tools/ce-bump/run.ts: manifests, CHECKED_COMPUTE_ENGINE, minimumReleaseAgeExclude, the lockfile),
# so the PR's own CI shows what breaks. Never auto-merges; the PR is reviewed and merged by hand.
#
# A PR opened with GITHUB_TOKEN does not trigger other workflows, so the branch is pushed and the PR
# opened with the `CE_BUMP_TOKEN` secret (a PAT or app token with contents and pull-requests write).
# Without it the workflow falls back to GITHUB_TOKEN and the PR gets no CI until someone pushes to it.

on:
  schedule:
    - cron: "50 6 * * *" # 06:50 UTC, after nightly.yml's 04:05 (its fixup read at 06:15), before ce-main.yml's 07:20
  workflow_dispatch:
    inputs:
      version:
        description: compute-engine version to bump to (default the latest on npm)
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write
  issues: read
  actions: read

concurrency:
  group: ce-release
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.CE_BUMP_TOKEN || github.token }}
      HAS_BUMP_TOKEN: ${{ secrets.CE_BUMP_TOKEN != '' }}
      INPUT_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.CE_BUMP_TOKEN || github.token }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.0
      - name: pick the version
        id: pick
        run: |
          node tools/ce-bump/run.ts --check --github-output | tee "$RUNNER_TEMP/check.txt"
          if [ -n "$INPUT_VERSION" ]; then
            echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(sed -n 's/^latest=//p' "$GITHUB_OUTPUT" | tail -1)" >> "$GITHUB_OUTPUT"
            echo "go=$(sed -n 's/^newer=//p' "$GITHUB_OUTPUT" | tail -1)" >> "$GITHUB_OUTPUT"
          fi
      - name: skip when the branch or a PR already exists
        id: gate
        if: steps.pick.outputs.go == 'true'
        env:
          VERSION: ${{ steps.pick.outputs.version }}
        run: |
          branch="chore/ce-$VERSION"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "$branch already exists on origin: nothing to do"
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          open=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$branch" --json number --jq 'length')
          if [ "$open" != "0" ]; then
            echo "an open PR has head $branch: nothing to do"
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"
      - name: bump, commit and push
        if: steps.gate.outputs.go == 'true'
        env:
          VERSION: ${{ steps.pick.outputs.version }}
        run: |
          branch="chore/ce-$VERSION"
          git config user.name enumeratio
          git config user.email enumeratio@users.noreply.github.com
          git checkout -b "$branch"
          node tools/ce-bump/run.ts "$VERSION"
          if git diff --quiet; then
            echo "the bump changed nothing"
            exit 1
          fi
          git add -u
          git commit -m "chore: compute-engine $VERSION"
          git push origin "$branch"
      - name: open the PR
        if: steps.gate.outputs.go == 'true'
        env:
          VERSION: ${{ steps.pick.outputs.version }}
        run: |
          branch="chore/ce-$VERSION"
          run_url=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ce-main.yml --limit 1 --json url --jq '.[0].url // empty' || true)
          issue_url=$(gh issue list --repo "$GITHUB_REPOSITORY" --label ce-main --state open --limit 1 --json url --jq '.[0].url // empty' || true)
          {
            echo "Bumps compute-engine to $VERSION: every manifest's range, \`CHECKED_COMPUTE_ENGINE\`, the \`minimumReleaseAgeExclude\` entry and the lockfile, by \`node tools/ce-bump/run.ts $VERSION\`."
            echo
            echo "- Release: https://github.com/cortex-js/compute-engine/releases/tag/v$VERSION"
            echo "- Changelog: https://github.com/cortex-js/compute-engine/blob/main/CHANGELOG.md"
            if [ -n "$run_url" ]; then
              echo "- Advance warning, the latest compute-engine main run: $run_url"
            else
              echo "- Advance warning: no compute-engine main run found."
            fi
            if [ -n "$issue_url" ]; then echo "- Its rolling issue: $issue_url"; fi
            echo
            echo "CI on this PR shows what the release breaks; a fix lane starts from there. Not auto-merging."
            if [ "$HAS_BUMP_TOKEN" != "true" ]; then
              echo
              echo "Opened with GITHUB_TOKEN (no \`CE_BUMP_TOKEN\` secret), so CI did not start: push an empty commit or close and reopen this PR."
            fi
          } > "$RUNNER_TEMP/body.md"
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
            --title "chore: compute-engine $VERSION" --body-file "$RUNNER_TEMP/body.md"
